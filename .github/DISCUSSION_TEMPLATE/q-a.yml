title: "Q: "
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using Mongrove.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do and what is happening?
      placeholder: Clear description of the question or problem
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mongrove version (optional)
      placeholder: e.g. 0.1.0

  - type: textarea
    id: steps
    attributes:
      label: Extra context (optional)
      description: Steps, error messages, or anything else that helps understand the situation.
      placeholder: Optional details
