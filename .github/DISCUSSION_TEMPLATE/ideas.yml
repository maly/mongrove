title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, especially anything that would make everyday aggregation work smoother.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see?
      placeholder: Describe the feature or improvement
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What problem does it solve or which workflow does it improve?
      placeholder: Current pain point or desired workflow
    validations:
      required: true
