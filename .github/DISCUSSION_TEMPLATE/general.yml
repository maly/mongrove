title: "Feedback: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Mongrove. This is soft launch — real feedback on the Aggregate Builder and UI density is especially useful.

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What worked, what didn't, or what surprised you?
      placeholder: |
        The Aggregate Builder feels...
        UI density is...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Aggregate Builder
        - UI density / overall feel
        - Data views (table / JSON / tree)
        - Explain / Schema
        - Connection / performance
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mongrove version (optional)
      placeholder: e.g. 0.1.0
