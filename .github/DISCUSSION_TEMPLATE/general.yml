title: "Feedback: "
body:
  - type: markdown
    attributes:
      value: |
        Soft launch feedback is welcome. The Aggregate Builder and overall UI density are the two things we're watching most closely right now.

  - type: dropdown
    id: area
    attributes:
      label: What is this mostly about?
      options:
        - Aggregate Builder
        - UI density / overall feel
        - Data views (table / JSON / tree)
        - Explain or Schema
        - Connection or performance
        - Something else
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What worked, what felt off, or what surprised you?
      placeholder: |
        The Aggregate Builder feels...
        UI density is...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mongrove version (optional)
      placeholder: e.g. 0.1.0
